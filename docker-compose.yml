name: loggingstack

services:
  loki:
    image: grafana/loki:3.4
    command:
      - -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    configs:
      - source: loki-config
        target: /etc/loki/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  promtail:
    image: grafana/promtail:3.4
    command:
      - -config.file=/etc/promtail/config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    configs:
      - source: promtail-config
        target: /etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana-enterprise:12.4
    ports:
      - "3001:3000"
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: change-this-password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/loki.yaml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  loki-data:
  promtail-positions:
  grafana-data:

configs:
  loki-config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        path_prefix: /loki
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules

      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

      limits_config:
        retention_period: 720h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        unordered_writes: true
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16

      analytics:
        reporting_enabled: false

  promtail-config:
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: http://loki:3100/loki/api/v1/push

      scrape_configs:
        - job_name: docker
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 10s

          relabel_configs:
            - source_labels:
                - __meta_docker_container_name
              regex: '/(.*)'
              target_label: container

            - source_labels:
                - __meta_docker_container_label_com_docker_compose_service
              target_label: service

            - source_labels:
                - __meta_docker_container_label_com_docker_swarm_service_name
              target_label: swarm_service

            - source_labels:
                - __meta_docker_container_log_stream
              target_label: stream

          pipeline_stages:
            - docker: {}

  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: true
          editable: true