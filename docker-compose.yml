name: loggingstack

services:
  grafana:
    image: grafana/grafana-enterprise:12.4
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-storage:/var/lib/grafana
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/datasource.yaml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logging

  loki:
    image: grafana/loki:3.4
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki-storage:/loki
    configs:
      - source: loki-config
        target: /etc/loki/loki-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - logging

  promtail:
    image: grafana/promtail:3.4
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    configs:
      - source: promtail-config
        target: /etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logging

networks:
  logging:
    driver: bridge

volumes:
  grafana-storage:
  loki-storage:
  promtail-positions:

configs:
  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: true
          editable: true

  loki-config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 2160h
        reject_old_samples: true
        reject_old_samples_max_age: 2160h
        unordered_writes: true

      compactor:
        working_directory: /loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 10
        delete_request_store: filesystem

      analytics:
        reporting_enabled: false

  promtail-config:
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: http://loki:3100/loki/api/v1/push
          backoff_config:
            min_period: 500ms
            max_period: 5m
            max_retries: 20

      scrape_configs:
        - job_name: docker
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 10s
          relabel_configs:
            - source_labels: [__meta_docker_container_label_com_docker_compose_service]
              regex: ^(loki|grafana|promtail)$
              action: drop
            - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
              regex: ^(primeerp-apibe-f0gld3|warna-kalimantan-admin-xboab3|warna-kalimantan-warna-kalimantan-9nohns|vidshub-newmain-8vd1ne)$
              action: keep
            - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
              target_label: service
            - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
              target_label: service_name
            - source_labels: [__meta_docker_container_log_stream]
              target_label: stream
            - source_labels: [__meta_docker_container_id]
              target_label: __path__
              replacement: /var/lib/docker/containers/$1/*-json.log
          pipeline_stages:
            - json:
                expressions:
                  stream: stream
            - labels:
                stream:
